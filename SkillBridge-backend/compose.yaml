services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-skillbridge_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.22
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/skillbridge
      DATABASE_USER: skillbridge
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-skillbridge_dev}
      DEMO_SEED: "true"
      MAIL_ENABLED: "true"
      SMTP_HOST: mail
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
