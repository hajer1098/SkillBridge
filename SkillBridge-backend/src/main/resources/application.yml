spring:
  application:
    name: skillbridge-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillbridge}
    username: ${DATABASE_USER:skillbridge}
    password: ${DATABASE_PASSWORD:skillbridge_dev}
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
skillbridge:
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:SkillBridge Admin}
  demo-seed: ${DEMO_SEED:false}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:hello@skillbridge.local}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai-url: ${AI_URL:}
  ai-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:}
management:
  endpoints:
    enabled-by-default: false
